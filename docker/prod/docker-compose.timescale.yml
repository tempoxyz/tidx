# TimescaleDB columnstore cold-tier overlay: swaps the postgres image for
# timescale/timescaledb so `[chains.timescale]` can be enabled in
# config.toml. Chain tables become hypertables; chunks behind the hot
# window are compressed to columnstore locally (no FDW, no view layer).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.timescale.yml up -d
#
# Enabling the cold tier requires a fresh database (blue/green re-sync);
# tidx refuses to convert tables that already hold data.
services:
  postgres:
    image: timescale/timescaledb:2.28.0-pg17
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - max_wal_size=16GB
      - -c
      - checkpoint_timeout=30min
      - -c
      - synchronous_commit=off
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=64MB
