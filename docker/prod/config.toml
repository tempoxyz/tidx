# TIDX Indexer Configuration (Production)
# Sensitive credentials are decoupled from repository files and loaded via environment variables.

[http]
enabled = true
port = 8080
bind = "0.0.0.0"

[prometheus]
enabled = true
port = 9090

[[chains]]
name = "moderato"
chain_id = 42431
rpc_url = "https://rpc.testnet.tempo.xyz"
rpc_auth_env = "TEMPO_RPC_AUTH_MODERATO"
backfill = true
batch_size = 100

[chains.postgres]
# Credentials omitted from URL; retrieved at runtime via password_env
url = "postgres://tidx@postgres:5432/tidx_moderato"
password_env = "POSTGRES_PASSWORD"

# ClickHouse OLAP engine (optional)
[chains.clickhouse]
enabled = true
url = "http://clickhouse:8123"

[[chains]]
name = "mainnet"
chain_id = 4217
rpc_url = "https://rpc.tempo.xyz"
rpc_auth_env = "TEMPO_RPC_AUTH_MAINNET"
backfill = true
batch_size = 100

[chains.postgres]
# Credentials omitted from URL; retrieved at runtime via password_env
url = "postgres://tidx@postgres:5432/tidx_mainnet"
password_env = "POSTGRES_PASSWORD"

# ClickHouse OLAP engine (optional)
[chains.clickhouse]
enabled = true
url = "http://clickhouse:8123"