# ZFS storage experiment stack: stock Postgres 16 on bind-mounted data/WAL
# directories (ZFS dataset mountpoints for ZFS lanes, plain dirs for the ext4
# baseline lane) + tidx built from source. No ClickHouse: this experiment
# measures the Postgres footprint only.
#
# See tasks/zfs-zstd-plan.md and docker/zfs/README.md. Driven by
# scripts/zfs/run-lane.sh; not intended for production as-is.
#
# !!! full_page_writes=off (PG_FULL_PAGE_WRITES=off) is ONLY safe while PGDATA
# !!! lives on a copy-on-write filesystem (ZFS). Never reuse that setting on
# !!! ext4/xfs volumes — torn pages will corrupt the database on power loss.

name: tidx-zfs

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tidx
      POSTGRES_PASSWORD: tidx
      POSTGRES_DB: tidx
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_WALDIR: /var/lib/postgresql/wal
    ports:
      - "${TIDX_PG_PORT:-5411}:5432"
    volumes:
      - ${TIDX_PGDATA:?set TIDX_PGDATA to the pgdata dir (ZFS dataset mountpoint or ext4 dir)}:/var/lib/postgresql/data
      - ${TIDX_PGWAL:?set TIDX_PGWAL to the WAL dir (ZFS dataset mountpoint or ext4 dir)}:/var/lib/postgresql/wal
      - ../../scripts/zfs/oltp:/oltp:ro
    command:
      - postgres
      # Match docker/prod settings so lanes are comparable with production.
      - -c
      - max_wal_size=16GB
      - -c
      - checkpoint_timeout=30min
      - -c
      - synchronous_commit=off
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - work_mem=64MB
      - -c
      - wal_level=minimal
      - -c
      - max_wal_senders=0
      # ZFS-lane knobs (defaults are the safe stock values; run-lane.sh flips
      # them for ZFS lanes only).
      - -c
      - full_page_writes=${PG_FULL_PAGE_WRITES:-on}
      - -c
      - wal_init_zero=${PG_WAL_INIT_ZERO:-on}
      - -c
      - wal_recycle=${PG_WAL_RECYCLE:-on}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tidx -d tidx"]
      interval: 2s
      timeout: 5s
      retries: 30

  tidx:
    build:
      context: ../..
      dockerfile: Dockerfile
    command:
      - up
      - --config
      - /config.toml
    ports:
      - "${TIDX_HTTP_PORT:-8080}:8080"
      - "${TIDX_METRICS_PORT:-9090}:9090"
    volumes:
      - ./config.gen.toml:/config.toml:ro
    environment:
      RUST_LOG: ${RUST_LOG:-tidx=info}
      TEMPO_RPC_AUTH_MODERATO: ${TEMPO_RPC_AUTH_MODERATO:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
