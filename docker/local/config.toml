# TIDX Test Configuration

[http]
enabled = true
port = 8080
bind = "0.0.0.0"

[prometheus]
enabled = true
port = 9090

[[chains]]
name = "dev"
chain_id = 1337
rpc_url = "http://tempo:8545"
pg_url = "postgres://tidx:tidx@timescaledb:5432/tidx"
backfill = true
batch_size = 100

# ClickHouse OLAP engine
[chains.clickhouse]
enabled = true
url = "http://clickhouse:8123"

# TimescaleDB columnstore cold tier (dev-scale windows so chunk
# compression actually triggers while the local stack runs).
[chains.timescale]
enabled = true
chunk_blocks = 10000
hot_window_blocks = 20000
interval_secs = 60
