# TIDX Test Configuration

[http]
enabled = true
port = 8080
bind = "0.0.0.0"

[prometheus]
enabled = true
port = 9090

[[chains]]
name = "dev"
chain_id = 1337
rpc_url = "http://tempo:8545"
pg_url = "postgres://tidx:tidx@postgres:5432/tidx"
pg_table_am = "orioledb"
pg_compress = 3
backfill = true
batch_size = 100

# ClickHouse OLAP engine
[chains.clickhouse]
enabled = true
url = "http://clickhouse:8123"
