# TIDX Indexer Configuration

[http]
enabled = true
port = 8080
bind = "0.0.0.0"

[prometheus]
enabled = true
port = 9090

[[chains]]
name = "moderato"
chain_id = 42431
rpc_url = "https://rpc.testnet.tempo.xyz"
rpc_auth_env = "TEMPO_RPC_AUTH_MODERATO"
backfill = true
batch_size = 500
concurrency = 8

[chains.postgres]
url = "postgres://tidx:tidx@postgres:5432/tidx_moderato"
# password_env = "TIDX_PG_PASSWORD"
# api_url = "postgres://tidx:tidx@postgres-replica:5432/tidx_moderato"
# api_password_env = "TIDX_API_PG_PASSWORD"

# ClickHouse OLAP engine (optional)
# Data is written directly via HTTP batch inserts (JSONEachRow).
# Queries go to the primary; failover instances are tried on connection failure.
[chains.clickhouse]
enabled = false
url = "http://clickhouse:8123"
# failover_urls = ["http://clickhouse-2:8123"]
# user = "default"
# password_env = "CH_PASSWORD"
# Historical derived-table gap repair runs after base ClickHouse backfill by default.
# repair_derived_on_startup = true
# Self-hosted multi-replica clusters: create the database with ENGINE = Replicated
# and MergeTree tables as their Replicated* counterparts. Leave off for
# ClickHouse Cloud and single-node instances.
# replicated_database = true

[[chains]]
name = "mainnet"
chain_id = 4217
rpc_url = "https://rpc.tempo.xyz"
rpc_auth_env = "TEMPO_RPC_AUTH_MAINNET"
backfill = true
batch_size = 500
concurrency = 8

[chains.postgres]
url = "postgres://tidx:tidx@postgres:5432/tidx_mainnet"
# password_env = "TIDX_PG_PASSWORD"
# api_url = "postgres://tidx:tidx@postgres-replica:5432/tidx_mainnet"
# api_password_env = "TIDX_API_PG_PASSWORD"

# ClickHouse OLAP engine (optional)
[chains.clickhouse]
enabled = false
url = "http://clickhouse:8123"
# failover_urls = ["http://clickhouse-2:8123"]
# user = "default"
# password_env = "CH_PASSWORD"
# Historical derived-table gap repair runs after base ClickHouse backfill by default.
# repair_derived_on_startup = true
# Self-hosted multi-replica clusters: create the database with ENGINE = Replicated
# and MergeTree tables as their Replicated* counterparts. Leave off for
# ClickHouse Cloud and single-node instances.
# replicated_database = true
