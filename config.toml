# TIDX Indexer Configuration

[http]
enabled = true
port = 8080
bind = "0.0.0.0"

[prometheus]
enabled = true
port = 9090

[[chains]]
name = "moderato"
chain_id = 42431
rpc_url = "https://rpc.testnet.tempo.xyz"
rpc_auth_env = "TEMPO_RPC_AUTH_MODERATO"
pg_url = "postgres://tidx:tidx@postgres:5432/tidx_moderato"
backfill = true
batch_size = 500
concurrency = 8

# TimescaleDB columnstore cold tier (optional)
# Chain tables become hypertables chunked by block number; fully-populated
# chunks behind the hot window are compressed to columnstore (bloom sparse
# indexes keep point lookups fast on cold data). Requires a Postgres
# server running the timescaledb extension (e.g. timescale/timescaledb
# image) and a fresh database at first enable.
# [chains.timescale]
# enabled = true
# chunk_blocks = 1000000        # blocks per chunk (locked at first boot)
# hot_window_blocks = 5000000   # trailing blocks kept uncompressed
# interval_secs = 300           # maintenance pass interval

# ClickHouse OLAP engine (optional)
# Data is written directly via HTTP batch inserts (JSONEachRow).
# Queries go to the primary; failover instances are tried on connection failure.
[chains.clickhouse]
enabled = false
url = "http://clickhouse:8123"
# failover_urls = ["http://clickhouse-2:8123"]
# user = "default"
# password_env = "CH_PASSWORD"
# Historical derived-table gap repair runs after base ClickHouse backfill by default.
# repair_derived_on_startup = true

[[chains]]
name = "mainnet"
chain_id = 4217
rpc_url = "https://rpc.tempo.xyz"
rpc_auth_env = "TEMPO_RPC_AUTH_MAINNET"
pg_url = "postgres://tidx:tidx@postgres:5432/tidx_mainnet"
backfill = true
batch_size = 500
concurrency = 8

# ClickHouse OLAP engine (optional)
[chains.clickhouse]
enabled = false
url = "http://clickhouse:8123"
# failover_urls = ["http://clickhouse-2:8123"]
# user = "default"
# password_env = "CH_PASSWORD"
# Historical derived-table gap repair runs after base ClickHouse backfill by default.
# repair_derived_on_startup = true
