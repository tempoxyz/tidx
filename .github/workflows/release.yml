name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    if: github.repository == 'tempoxyz/tidx' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.changelogs.outputs.published }}
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch GitHub token via STS
        id: app-token
        uses: tempoxyz/gh-actions/actions/github-sts@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          policy: release
      - id: changelogs
        uses: tempoxyz/changelogs@35288d5b399317c9412f9dd4bfaf8cccf2d22215 # v0.11.0
        with:
          conventional-commit: true
          github-token: ${{ steps.app-token.outputs.token }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # Get the tag that was just created (if any)
      - name: Get release tag
        id: get-tag
        if: steps.changelogs.outputs.published == 'true'
        run: |
          tag=$(git tag --points-at HEAD | grep '^tidx@' | head -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Released tag: $tag"

  # Build and upload binaries after release
  binaries:
    needs: release
    if: needs.release.outputs.published == 'true' && needs.release.outputs.tag != ''
    uses: ./.github/workflows/binary.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: write
      id-token: write

  # Build and push Docker image after release
  docker:
    needs: release
    if: needs.release.outputs.published == 'true' && needs.release.outputs.tag != ''
    uses: ./.github/workflows/docker.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: read
      id-token: write
      packages: write
