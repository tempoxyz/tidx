name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    if: github.repository == 'tempoxyz/tidx' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.changelogs.outputs.published }}
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d39baa2b43f5eba5d261c047521a4fbd56101129 # 2026-09-23T04-31-11Z-d39baa2b

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch GitHub token via STS
        id: app-token
        uses: tempoxyz/gh-actions/actions/github-sts@d39baa2b43f5eba5d261c047521a4fbd56101129 # 2026-09-23T04-31-11Z-d39baa2b
        with:
          policy: release
      - id: changelogs
        uses: tempoxyz/changelogs@fed7de62e4b5dc585c6eb77aabd1264ecbe82640 # 2026-09-07T12-57-31Z-83e69646 zizmor: ignore[ref-version-mismatch]
        with:
          conventional-commit: true
          github-token: ${{ steps.app-token.outputs.token }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # Get the tag that was just created (if any)
      - name: Get release tag
        id: get-tag
        if: steps.changelogs.outputs.published == 'true'
        run: |
          tag=$(git tag --points-at HEAD | grep '^tidx@' | head -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Released tag: $tag"

  # Build and upload binaries after release
  binaries:
    needs: release
    if: needs.release.outputs.published == 'true' && needs.release.outputs.tag != ''
    uses: ./.github/workflows/binary.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: write
      id-token: write

  # Build and push Docker image after release
  docker:
    needs: release
    if: needs.release.outputs.published == 'true' && needs.release.outputs.tag != ''
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: read
      id-token: write
      packages: write
