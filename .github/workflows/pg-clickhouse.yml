name: Publish pg_clickhouse

# Builds ClickHouse/pg_clickhouse at a pinned commit and publishes it as
# ghcr.io/tempoxyz/pg_clickhouse. Upstream only publishes images on release
# tags, and the fix for LATERAL / correlated-subquery crashes over foreign
# tables (ClickHouse/pg_clickhouse#296) is only on main (unreleased 0.4).
# Drop this workflow once upstream releases 0.4.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'ClickHouse/pg_clickhouse commit SHA to build'
        required: true
        default: '02505c48130e3fd7d13bf4ffb2de6bfeca76a84b'
        type: string
      pg_major:
        description: 'PostgreSQL major version'
        required: true
        default: '16'
        type: string
  push:
    paths:
      - '.github/workflows/pg-clickhouse.yml'

env:
  UPSTREAM_REF: ${{ inputs.ref || '02505c48130e3fd7d13bf4ffb2de6bfeca76a84b' }}
  PG_MAJOR: ${{ inputs.pg_major || '16' }}

jobs:
  docker:
    name: Build pg_clickhouse
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout ClickHouse/pg_clickhouse
        uses: actions/checkout@v4
        with:
          repository: ClickHouse/pg_clickhouse
          ref: ${{ env.UPSTREAM_REF }}
          submodules: recursive

      - name: Compute tags
        id: meta
        run: |
          short_sha=$(printf '%s' "$UPSTREAM_REF" | cut -c1-7)
          image=ghcr.io/${{ github.repository_owner }}/pg_clickhouse
          echo "tags=${image}:${PG_MAJOR}-${short_sha},${image}:${PG_MAJOR}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PG_MAJOR=${{ env.PG_MAJOR }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=pg_clickhouse (PostgreSQL ${{ env.PG_MAJOR }}) built from ClickHouse/pg_clickhouse@${{ env.UPSTREAM_REF }}
            org.opencontainers.image.revision=${{ env.UPSTREAM_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
