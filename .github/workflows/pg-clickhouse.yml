name: Publish pg_clickhouse for CloudNativePG

# Adds ClickHouse/pg_clickhouse to the CloudNativePG PostgreSQL 18.3 minimal
# Trixie operand image and publishes the result as ghcr.io/tempoxyz/pg_clickhouse.
# The extension is pinned because the fix for LATERAL / correlated-subquery
# crashes over foreign tables (ClickHouse/pg_clickhouse#296) is only on main
# (unreleased 0.4).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'ClickHouse/pg_clickhouse commit SHA to build'
        required: true
        default: '02505c48130e3fd7d13bf4ffb2de6bfeca76a84b'
        type: string
  push:
    paths:
      - '.github/workflows/pg-clickhouse.yml'
      - 'docker/pg-clickhouse/**'

env:
  CNPG_BASE: ghcr.io/cloudnative-pg/postgresql:18.3-minimal-trixie
  UPSTREAM_REF: ${{ inputs.ref || '02505c48130e3fd7d13bf4ffb2de6bfeca76a84b' }}
  PG_MAJOR: '18'
  PG_VERSION: '18.3'

jobs:
  docker:
    name: Build pg_clickhouse
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout tidx
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout ClickHouse/pg_clickhouse
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ClickHouse/pg_clickhouse
          ref: ${{ env.UPSTREAM_REF }}
          path: docker/pg-clickhouse/src
          submodules: recursive

      - name: Compute tags
        id: meta
        run: |
          short_sha=$(printf '%s' "$UPSTREAM_REF" | cut -c1-7)
          image=ghcr.io/${{ github.repository_owner }}/pg_clickhouse
          echo "tags=${image}:${PG_VERSION}-minimal-trixie-${short_sha},${image}:${PG_VERSION}-minimal-trixie" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker/pg-clickhouse
          file: docker/pg-clickhouse/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            CNPG_BASE=${{ env.CNPG_BASE }}
            PG_MAJOR=${{ env.PG_MAJOR }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.base.name=${{ env.CNPG_BASE }}
            org.opencontainers.image.description=CloudNativePG PostgreSQL ${{ env.PG_VERSION }} minimal Trixie with pg_clickhouse built from ClickHouse/pg_clickhouse@${{ env.UPSTREAM_REF }}
            org.opencontainers.image.revision=${{ env.UPSTREAM_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
