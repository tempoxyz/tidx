name: Pull request audit

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  pr-audit:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      statuses: write
    uses: tempoxyz/gh-actions/.github/workflows/pr-audit.yml@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
    with:
      required-labels: |
        cyclops
        agentic-audit
    secrets:
      EVENTS_KEY: ${{ secrets.EVENTS_KEY }}
      EVENTS_CERT: ${{ secrets.EVENTS_CERT }}
      EVENTS_ARGS: ${{ secrets.EVENTS_ARGS }}

  pr-audit-comment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (
        startsWith(github.event.comment.body, 'cyclops audit') ||
        startsWith(github.event.comment.body, '@decofe cyclops audit') ||
        startsWith(github.event.comment.body, 'derek audit')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Handle audit command
        uses: tempoxyz/gh-actions/actions/pr-audit-comment@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        env:
          # The pinned action checks the commenter's repository permission before using these.
          EVENTS_ARGS: ${{ secrets.EVENTS_ARGS }} # zizmor: ignore[secrets-outside-env]
          EVENTS_CERT: ${{ secrets.EVENTS_CERT }} # zizmor: ignore[secrets-outside-env]
          EVENTS_KEY: ${{ secrets.EVENTS_KEY }} # zizmor: ignore[secrets-outside-env]
        with:
          command-regex: '^(?:@decofe\s+)?(?:cyclops\s+audit|derek\s+audit)\b'
          permission-check-mode: association
          organization: tempoxyz
          events-key: ${{ env.EVENTS_KEY }}
          events-cert: ${{ env.EVENTS_CERT }}
          events-args: ${{ env.EVENTS_ARGS }}
          github-token: ${{ github.token }}
