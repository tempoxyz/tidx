name: Pull request audit

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Publishes authorized audit events without checking out PR code.
    types: [synchronize, reopened, ready_for_review]
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  pr-audit:
    if: contains(fromJSON('["pull_request","pull_request_target"]'), github.event_name)
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      statuses: write
    uses: tempoxyz/gh-actions/.github/workflows/pr-audit.yml@ff385914926ea9e9d9647597b9cc501fb7b6d69a
    with:
      audit-on-command: true
      required-labels: |
        cyclops
        agentic-audit
    secrets:
      EVENTS_KEY: ${{ secrets.EVENTS_KEY }}
      EVENTS_CERT: ${{ secrets.EVENTS_CERT }}
      EVENTS_ARGS: ${{ secrets.EVENTS_ARGS }}

  pr-audit-comment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (
        startsWith(github.event.comment.body, 'cyclops audit') ||
        startsWith(github.event.comment.body, '@decofe cyclops audit') ||
        startsWith(github.event.comment.body, 'derek audit')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Handle audit command
        uses: tempoxyz/gh-actions/actions/pr-audit-comment@ff385914926ea9e9d9647597b9cc501fb7b6d69a
        env:
          # The pinned action checks the commenter's repository permission before using these.
          EVENTS_ARGS: ${{ secrets.EVENTS_ARGS }} # zizmor: ignore[secrets-outside-env]
          EVENTS_CERT: ${{ secrets.EVENTS_CERT }} # zizmor: ignore[secrets-outside-env]
          EVENTS_KEY: ${{ secrets.EVENTS_KEY }} # zizmor: ignore[secrets-outside-env]
        with:
          command-regex: '^(?:@decofe\s+)?(?:cyclops\s+audit|derek\s+audit)\b'
          permission-check-mode: association
          organization: tempoxyz
          events-key: ${{ env.EVENTS_KEY }}
          events-cert: ${{ env.EVENTS_CERT }}
          events-args: ${{ env.EVENTS_ARGS }}
          github-token: ${{ github.token }}
